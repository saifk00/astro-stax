name: GeForce benchmarks
on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main' && vars.GEFORCE_RUNNERS != '' && vars.GEFORCE_RUNNERS != '[]'
    strategy:
      fail-fast: false
      matrix:
        card: ${{ fromJSON(vars.GEFORCE_RUNNERS || '[]') }}
    name: ${{ matrix.card }}
    runs-on: [self-hosted, linux, x64, "${{ matrix.card }}"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Check for a GeForce GPU
        run: uv run --no-sync python -c "import torch; name = torch.cuda.get_device_name(); print(name); assert 'GeForce' in name"
      - name: Run tests on hardware
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Benchmark flat stacking
        run: uv run --no-sync python scripts/benchmark_geforce.py --output geforce.json
      - name: Summarize warm medians
        run: |
          {
            jq -r '"### " + .gpu' geforce.json
            echo '| Frames | Resident (s) | End to end (s) | Peak tensors (GiB) |'
            echo '| ---: | ---: | ---: | ---: |'
            jq -r '
              def fmt: . * 1000 | round / 1000;
              .cases[] | if .status == "ok" then
                "| \(.frames) | \(.resident_s | fmt) | \(.end_to_end_s | fmt) | \(.peak_tensor_bytes / 1073741824 | fmt) |"
              else "| \(.frames) | Out of memory | — | — |" end' geforce.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geforce-${{ matrix.card }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: geforce.json
          if-no-files-found: error
          retention-days: 90
